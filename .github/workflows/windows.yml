name: Windows build

# A Release build of ReiPan for Windows (64-bit, MSVC), uploaded as an
# artifact: the executable, the FFmpeg DLLs and resources/, ready to run with
# your own game files.  Run it by hand (Actions > Windows build > Run
# workflow, any branch); the Release workflow calls it too.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      name:
        description: 'Artifact (and folder) name'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Visual Studio's generator, as the README's commands use; it ignores
      # CMAKE_BUILD_TYPE for the build itself, which is why --config Release
      # below matters, but the log banner reads the type from it.
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        id: package
        shell: pwsh
        env:
          NAME: ${{ inputs.name }}
        run: |
          $exe = Get-ChildItem -Path build/ReiPan -Recurse -Filter ReiPan.exe | Select-Object -First 1
          if (-not $exe) { throw "ReiPan.exe was not built" }
          $name = $env:NAME
          if (-not $name) { $name = "ReiPan-windows-" + "${{ github.sha }}".Substring(0, 8) }
          $dest = "package/$name"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "$($exe.DirectoryName)/*" -Destination $dest -Recurse
          Get-ChildItem -Path $dest -Recurse -Include *.pdb,*.ilk,*.exp,*.lib | Remove-Item -Force
          Copy-Item README.md, LICENSE -Destination $dest
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: package/${{ steps.package.outputs.name }}
          if-no-files-found: error
